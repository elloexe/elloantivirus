[workspace]
resolver = "2"
members = [
    "crates/ello-common",
    "crates/ello-engine",
    "crates/ello-quarantine",
    "crates/ello-cli",
    "crates/ello-service",
    "crates/ello-sigtool",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Ello Antivirus"]
rust-version = "1.80"

[workspace.dependencies]
ello-common = { path = "crates/ello-common" }
ello-engine = { path = "crates/ello-engine" }
ello-quarantine = { path = "crates/ello-quarantine" }

aho-corasick = "1"
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
goblin = { version = "0.9", default-features = false, features = ["std", "pe32", "pe64"] }
hex = "0.4"
notify = "6"
rand = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.32"
tempfile = "3"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true
